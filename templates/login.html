{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="card" style="max-width:360px; margin:0 auto;">
    <h2 class="center">Admin Login</h2>
    {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
    <form method="POST">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button class="btn" type="submit" style="width:100%;">Log In</button>
    </form>
    <p class="muted" style="font-size:0.8rem; margin-top:14px;">
        First run? Check the server console output for the generated admin password.
    </p>
</div>
{% endblock %}
